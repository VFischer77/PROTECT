name: PROTECT P05.6 browser design review
on:
  push:
    branches:
      - pilot/protect-abi-p056-browser-founder-review
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile browser walkthrough
        run: python tests/p056_browser_walkthrough.py
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protect-p056-browser-evidence
          path: qualification/p056-browser-evidence/
          if-no-files-found: warn
